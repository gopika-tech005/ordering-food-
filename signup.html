
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Foodie Spot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🍴 Foodie Spot</h1>

            <h2>Create Account</h2>

            <p>Sign up to order your favourite food</p>


            <input
                type="text"
                id="signup-name"
                placeholder="Full Name"
            >

            <input
                type="email"
                id="signup-email"
                placeholder="Email"
            >

            <input
                type="password"
                id="signup-password"
                placeholder="Password"
            >


            <button
                class="order-btn"
                onclick="signupUser()">

                Sign Up

            </button>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
