
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Food Details - Foodie</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            🍴 Foodie
        </div>

        <button class="cart-btn"
            onclick="history.back()">
            ← Back
        </button>

    </header>


    <section class="food-details">

        <div class="big-food-image" id="food-image">
            🍛
        </div>


        <div class="details">

            <h1 id="food-name">
                Chicken Biryani
            </h1>

            <p class="rating">
                ⭐ 4.8 (120 Reviews)
            </p>

            <h2 id="food-price">
                ₹199
            </h2>

            <p id="food-description">
                Spicy and delicious chicken biryani
                prepared with aromatic spices,
                basmati rice and tender chicken.
            </p>

            <button
                class="order-btn"
                id="add-button">

                Add to Cart

            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
