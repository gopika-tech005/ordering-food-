
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Foodie Spot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🍴 Foodie Spot</h1>

            <h2>Welcome Back!</h2>

            <p>Login to continue</p>


            <input
                type="email"
                id="login-email"
                placeholder="Email"
            >

            <input
                type="password"
                id="login-password"
                placeholder="Password"
            >


            <button
                class="order-btn"
                onclick="loginUser()">

                Login

            </button>


            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
